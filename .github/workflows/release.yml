name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install rumdl globally
        run: bun add -g rumdl

      - name: Run lint and format checks
        run: |
          bun run lint
          bun run format:check
          rumdl check .

      - name: Compile
        run: bun run compile

      - name: Package extension
        run: bun run package
        id: package

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(cat package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Extract the changelog entry for this version
          awk -v ver="$VERSION" '
            /^## v/ {
              if (in_section && ver != current_ver) exit
              if ($2 == "v" ver) {
                in_section = 1
                current_ver = $2
                next
              } else if (in_section) {
                exit
              }
            }
            in_section { print }
          ' CHANGELOG.md > /tmp/changelog.txt
          # Remove trailing empty lines
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' /tmp/changelog.txt
          cat /tmp/changelog.txt
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find .vsix file
        id: vsix
        run: |
          VSIX_FILE=$(ls -1 *.vsix | head -1)
          echo "file=$VSIX_FILE" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.vsix.outputs.file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
